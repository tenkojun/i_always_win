# I ALWAYS WIN 중앙 인증 서버 — Cloudflare Worker 설정
#
# 배포 순서
#   1) wrangler d1 create iaw-auth      → database_id 를 아래에 붙여넣기
#   2) npm run db:init                  → 스키마 적용
#   3) wrangler secret put ADMIN_PASSWORD   ← 없으면 어드민이 생기지 않는다
#   4) npm run deploy

name = "iaw-auth"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# D1 (계정 DB) 바인딩
[[d1_databases]]
binding = "DB"                        # 코드에서 env.DB
database_name = "iaw-auth"
database_id = "01199aec-18fd-4216-852b-d248cf35db34"

[vars]
ADMIN_USERNAME = "JUNHWA"
# CORS 허용 origin. 앱 도메인이 정해지면 구체적으로 좁힌다.
#   ALLOWED_ORIGINS = "https://terminal.example.com,https://iaw.example.com"
ALLOWED_ORIGINS = "*"

# 시크릿 (코드·저장소에 두지 않는다)
#   wrangler secret put ADMIN_PASSWORD

# 커스텀 도메인을 붙일 때만 주석 해제
# [[routes]]
# pattern = "auth.example.com/*"
# zone_name = "example.com"
