<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIQT · STRATEGY · 전략 백테스트</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<!-- P3: Plotly (월별 히트맵 + 풍부 메트릭 시각화) -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  :root{
    --bg:#05070a; --panel:#0a0f16; --panel2:#0d141e;
    --line:#16202e; --grid:rgba(61,240,255,.05);
    --cyan:#3df0ff; --cyan-dim:#1c6f7a; --amber:#ffb44c;
    --up:#ff5a52; --down:#4d9cff;
    --txt:#cfe6ec; --txt-dim:#5d7480; --txt-mute:#3a4a55;
    --mono:'JetBrains Mono',monospace;
    --kr:'IBM Plex Sans KR',sans-serif;
    --glow:0 0 14px rgba(61,240,255,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--kr);
    overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    z-index:9999;background:repeating-linear-gradient(0deg,
      rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);
    mix-blend-mode:multiply;opacity:.5}

  .app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:#070b10}
  .topbar .ti{font-family:var(--mono);font-size:14px;letter-spacing:3px;
    color:var(--cyan);font-weight:700;text-shadow:var(--glow)}
  .topbar .sub{font-family:var(--mono);font-size:11px;
    color:var(--cyan-dim);letter-spacing:1.5px}
  .topbar .gap{flex:1}
  .topbar input[type=text]{background:#0a1018;border:1px solid var(--line);
    color:var(--cyan);font-family:var(--mono);font-size:13px;
    padding:6px 12px;outline:none;width:140px;text-align:center;
    letter-spacing:1px;border-radius:2px}
  .topbar input:focus{border-color:var(--cyan-dim)}
  .topbar select{background:#0a1018;border:1px solid var(--line);
    color:var(--txt);font-family:var(--mono);font-size:12px;
    padding:6px 10px;outline:none;border-radius:2px}
  .topbar .btn{background:var(--cyan);color:#04222a;border:0;
    font-family:var(--mono);font-weight:700;font-size:12px;
    padding:7px 16px;cursor:pointer;letter-spacing:1.5px;border-radius:2px}
  .topbar .btn:disabled{opacity:.5;cursor:wait}
  .topbar .mode{display:flex;border:1px solid var(--cyan-dim);
    border-radius:2px;overflow:hidden}
  .topbar .mode button{background:transparent;color:var(--txt-dim);
    border:0;font-family:var(--mono);font-size:11px;padding:6px 14px;
    cursor:pointer;letter-spacing:1px}
  .topbar .mode button.on{background:var(--cyan-dim);color:#04222a;
    font-weight:700}

  .strat-bar{display:flex;align-items:center;gap:10px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:#080d13;flex-wrap:wrap}
  .strat-bar .lab{font-family:var(--mono);font-size:10px;
    color:var(--cyan-dim);letter-spacing:1.5px}
  .strat-bar .strat-card{display:flex;align-items:center;gap:8px;
    padding:6px 12px;border:1px solid var(--line);border-radius:2px;
    background:#0a1018;cursor:pointer;transition:all .15s}
  .strat-bar .strat-card:hover{border-color:var(--cyan-dim)}
  .strat-bar .strat-card.on{border-color:var(--cyan);
    box-shadow:0 0 8px rgba(61,240,255,.3);background:rgba(61,240,255,.05)}
  .strat-bar .strat-card .name{font-family:var(--mono);font-size:11px;
    color:var(--cyan);font-weight:600}
  .strat-bar .strat-card .desc{font-size:10px;color:var(--txt-mute)}

  .main{display:grid;grid-template-columns:1fr 320px;min-height:0;
    overflow:hidden}
  .chart-wrap{display:flex;flex-direction:column;min-width:0}
  #chart{flex:1;min-height:0}
  .side{border-left:1px solid var(--line);background:#070b10;
    overflow:auto;padding:14px}
  .side h3{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;
    color:var(--cyan-dim);font-weight:700;margin-bottom:8px;
    padding-bottom:5px;border-bottom:1px solid var(--line)}

  /* 심화: 파라미터 슬라이더 */
  .param-row{display:grid;grid-template-columns:90px 1fr 50px;
    gap:10px;align-items:center;padding:5px 0;font-size:11px}
  .param-row label{font-family:var(--mono);color:var(--txt-mute);
    letter-spacing:.5px}
  .param-row input[type=range]{accent-color:var(--cyan);width:100%}
  .param-row .v{font-family:var(--mono);color:var(--cyan);
    text-align:right;font-weight:700}

  /* 결과 카드 */
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;
    margin-bottom:12px}
  .res-cell{padding:9px 11px;background:rgba(255,255,255,.025);
    border-radius:3px}
  .res-cell .l{font-family:var(--mono);font-size:9.5px;
    color:var(--txt-mute);letter-spacing:1px;margin-bottom:3px}
  .res-cell .v{font-size:15px;font-weight:700}

  .footer{padding:8px 16px;border-top:1px solid var(--line);
    background:#070b10;font-family:var(--mono);font-size:10px;
    color:var(--txt-mute);display:flex;gap:14px;flex-wrap:wrap}
  .footer .ok{color:var(--cyan)}
  .footer .err{color:var(--down)}

  @media(max-width:920px){
    .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .side{max-height:42vh;border-left:0;
      border-top:1px solid var(--line)}
    .topbar{flex-wrap:wrap;gap:8px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- 상단 -->
  <div class="topbar">
    <span class="ti">STRATEGY</span>
    <span class="sub">전략 백테스트 · 차트 매수/매도 타점</span>
    <span class="gap"></span>
    <input id="ticker" type="text" placeholder="AAPL"
      onkeydown="if(event.key==='Enter')runBacktest()">
    <select id="period">
      <option value="180">6개월</option>
      <option value="365" selected>1년</option>
      <option value="730">2년</option>
      <option value="1825">5년</option>
    </select>
    <select id="timeframe" onchange="onTimeframeChange()" title="봉 단위">
      <option value="1d" selected>1일봉</option>
      <option value="1h">1시간봉</option>
      <option value="15m">15분봉</option>
      <option value="5m">5분봉</option>
      <option value="1m">1분봉</option>
    </select>
    <div class="mode">
      <button id="m-simple" class="on" onclick="setMode('simple')">간편</button>
      <button id="m-advanced" onclick="setMode('advanced')">심화</button>
    </div>
    <button class="btn" id="run-btn" onclick="runBacktest()">▶ 실행</button>
    <button class="btn" id="grid-btn" onclick="runGrid()"
      style="background:var(--amber)">⚙ Grid</button>
    <button class="btn" id="mega-btn" onclick="runMegaGrid()"
      style="background:linear-gradient(90deg,var(--up),var(--amber));
      color:#fff" title="모든 전략 + 모든 파라미터 시험 (5-15분)">
      ⚡ MEGA</button>
  </div>

  <!-- P5: 포지션 사이징 / 레버리지 / SL·TP (기본 접힘) -->
  <details style="padding:6px 18px;border-bottom:1px solid var(--line);
    background:var(--panel)">
    <summary style="cursor:pointer;font-family:var(--mono);font-size:11px;
      color:var(--amber);letter-spacing:1.2px;user-select:none">
      ⚖ 포지션 옵션 (P5) — 사이징 · 레버리지 · 손익절
    </summary>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
      padding:10px 4px;font-family:var(--mono);font-size:11px">
      <label title="한 트레이드 사이즈 (size_type에 따라 단위)">사이즈
        <input id="bt-size" type="number" step="any" placeholder="기본(전액)"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:4px 6px;font-family:var(--mono)"></label>
      <label title="사이즈 단위 — amount(주식수) · percent(자본%) · value(달러) · targetpercent">단위
        <select id="bt-size-type"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:4px 6px;font-family:var(--mono)">
          <option value="amount" selected>amount (주식수)</option>
          <option value="percent">percent (자본 %)</option>
          <option value="value">value ($)</option>
          <option value="targetpercent">targetpercent</option>
        </select></label>
      <label title="레버리지 — 1.0=현물 · 2.0/3.0=마진. size에 곱해짐.">레버리지
        <input id="bt-leverage" type="number" step="0.5" min="1" max="10"
          value="1" style="width:100%;background:var(--panel2);
          border:1px solid var(--line);color:var(--txt);padding:4px 6px;
          font-family:var(--mono)"></label>
      <label title="슬리피지 — 0.0001 = 1bp">슬리피지
        <input id="bt-slip" type="number" step="0.0001" value="0.0001"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:4px 6px;font-family:var(--mono)"></label>
      <label title="Almgren-Chriss 거래량 기반 자동 슬리피지 — 큰 주문일수록 비선형 ↑"
        style="display:flex;align-items:center;gap:4px">
        <input id="bt-auto-slip" type="checkbox"
          style="accent-color:var(--cyan)">
        <span style="font-size:10.5px">⚡ 자동 슬리피지 (AC)</span></label>
      <label title="Stop-loss % — 0.05 = -5%에서 강제 청산">SL %
        <input id="bt-sl" type="number" step="0.01" placeholder="없음"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:4px 6px;font-family:var(--mono)"></label>
      <label title="Take-profit % — 0.10 = +10%에서 익절">TP %
        <input id="bt-tp" type="number" step="0.01" placeholder="없음"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:4px 6px;font-family:var(--mono)"></label>
      <label title="Trailing stop % — 진입 후 최고가 대비 -X% 하락 시 청산">Trail %
        <input id="bt-trail" type="number" step="0.01" placeholder="없음"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:4px 6px;font-family:var(--mono)"></label>
      <div style="font-size:10.5px;color:var(--txt-mute);
        display:flex;align-items:center">
        💡 비워두면 vbt 기본값 (전액 매수, no SL/TP)
      </div>
    </div>
  </details>

  <!-- regime 추천 배너 -->
  <div id="regime-bar" style="display:none;padding:8px 18px;
    background:linear-gradient(90deg,rgba(61,240,255,.08),
    rgba(61,240,255,0));border-bottom:1px solid var(--cyan-dim);
    font-family:var(--mono);font-size:11px;color:var(--cyan);
    letter-spacing:1px">
    <span id="regime-text">— regime 감지 중 —</span>
    <button onclick="loadRegime()" style="margin-left:12px;
      background:transparent;border:1px solid var(--cyan-dim);
      color:var(--cyan);font-family:var(--mono);font-size:10px;
      padding:2px 8px;cursor:pointer;letter-spacing:1px">↻ 재감지</button>
  </div>

  <!-- 전략 선택 — 컴팩트 chip + 팝업 -->
  <div class="strat-bar">
    <span class="lab">전략:</span>
    <button id="strat-current-chip" onclick="openStratPicker()"
      style="background:var(--panel2);border:1px solid var(--cyan);
      color:var(--cyan);padding:6px 14px;font-family:var(--mono);font-size:12px;
      cursor:pointer;letter-spacing:.5px;display:flex;align-items:center;gap:8px">
      <span id="strat-current-name">sma_cross</span>
      <span style="color:var(--cyan-dim);font-size:10px">▼ 변경</span>
    </button>
    <span id="strat-current-desc" style="color:var(--txt-dim);font-size:11px;
      font-family:var(--mono)">단기 SMA가 장기 SMA를 상향 돌파</span>
  </div>

  <!-- 전략 선택 팝업 모달 -->
  <div id="strat-picker-mask" style="display:none;position:fixed;inset:0;
    z-index:1100;background:rgba(5,7,10,.92);align-items:flex-start;
    justify-content:center;padding-top:60px">
    <div style="background:var(--panel);border:1px solid var(--cyan);
      width:min(900px,94vw);max-height:80vh;overflow:auto;border-radius:4px;
      box-shadow:0 0 40px rgba(61,240,255,.2)">
      <div style="padding:14px 22px;border-bottom:1px solid var(--cyan);
        background:linear-gradient(90deg,rgba(61,240,255,.10),transparent);
        display:flex;align-items:center;gap:12px">
        <span style="font-family:var(--mono);color:var(--cyan);
          letter-spacing:2px;font-weight:800">📋 전략 선택</span>
        <input id="strat-picker-search" type="text" placeholder="🔍 검색..."
          oninput="renderStratPicker(this.value)"
          style="background:var(--panel2);border:1px solid var(--line);
          color:var(--txt);padding:5px 10px;font-family:var(--mono);
          font-size:12px;width:200px">
        <span style="margin-left:auto;color:var(--txt-mute);font-family:var(--mono);
          font-size:10px">ESC 닫기</span>
        <button onclick="closeStratPicker()"
          style="background:transparent;color:var(--txt-dim);border:1px solid var(--line);
          padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:11px">✕</button>
      </div>
      <div id="strat-picker-body" style="padding:16px 22px"></div>
    </div>
  </div>

  <!-- 메인: 차트 + 사이드 결과 -->
  <div class="main">
    <div class="chart-wrap">
      <div id="chart"></div>
    </div>
    <div class="side">
      <div id="adv-params" style="display:none;margin-bottom:14px">
        <h3>파라미터 (심화)</h3>
        <div id="param-rows"></div>
      </div>
      <h3>RESULT · 결과</h3>
      <div id="result-body">
        <div style="color:var(--txt-mute);font-size:12px;
          padding:14px 0;text-align:center">
          전략 선택 후 ▶ 실행
        </div>
      </div>
    </div>
  </div>

  <!-- footer -->
  <div class="footer">
    <span id="status">대기 중</span>
    <span class="gap" style="flex:1"></span>
    <span id="data-info"></span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// URL 파라미터로 ticker 받기
const urlParams = new URLSearchParams(location.search);
const initialTicker = (urlParams.get('ticker') || 'AAPL').toUpperCase();
$('#ticker').value = initialTicker;

// 전략 정의 — 서버 /api/strategy/meta에서 자동 fetch (init 시)
let STRATEGIES = [];

let CURRENT_STRAT = 'sma_cross';
let MODE = 'simple';     // 'simple' | 'advanced'
let chart, candleSeries;
let markerSeries = null;
let lastResult = null;

// ---------- 차트 init ----------
function initChart(){
  chart = LightweightCharts.createChart($('#chart'), {
    layout:{background:{color:'transparent'},textColor:'#5d7480'},
    grid:{vertLines:{color:'rgba(61,240,255,.05)'},
          horzLines:{color:'rgba(61,240,255,.05)'}},
    timeScale:{borderColor:'#16202e',timeVisible:true,secondsVisible:false},
    rightPriceScale:{borderColor:'#16202e'},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    autoSize:true,
  });
  candleSeries = chart.addCandlestickSeries({
    upColor:'#ff5a52', downColor:'#4d9cff',
    borderUpColor:'#ff5a52', borderDownColor:'#4d9cff',
    wickUpColor:'#ff5a52', wickDownColor:'#4d9cff',
  });
}

// ---------- 전략 카테고리 분류 (팝업용) ----------
const STRAT_CATEGORIES = [
  {label:'🔼 추세추종', desc:'추세를 따라가는 전략 (장기 보유)',
    ids:['sma_cross','macd','supertrend','adx_trend','triple_screen','donchian']},
  {label:'🔄 평균회귀', desc:'과매수/과매도 반전 (단기 매매)',
    ids:['rsi_mr','bb_revert','zscore_mr','keltner','vwap_revert']},
  {label:'⚡ 모멘텀/돌파', desc:'급등/돌파 모멘텀 잡기',
    ids:['roc','bb_breakout','ichimoku']},
  {label:'🕯 캔들 패턴',  desc:'캔들/HA 패턴 기반',
    ids:['engulfing','heikin_ashi','dva']},
  {label:'🏛 SMC/Orderflow', desc:'기관 흔적 + 주문흐름',
    ids:['smc_ob','cvd_div','orderflow']},
  {label:'📅 이벤트 기반', desc:'어닝 + 이벤트 drift',
    ids:['pead','hybrid_of_pead']},
  {label:'⚡ 마이크로구조', desc:'거래량/호가/CVD 단기 시그널 (KIS 키 있으면 실시간 틱)',
    ids:['speed_of_tape','book_pressure','real_cvd_div']},
  {label:'🧠 ML — 분류 (확률)', desc:'다음 N봉 상승 확률 예측',
    ids:['ml_rf_cls','ml_xgb_cls','ml_lstm_cls','ml_gru_cls','ml_tf_cls']},
  {label:'🧠 ML — 회귀 (수익률)', desc:'다음 N봉 수익률 예측',
    ids:['ml_rf_reg','ml_xgb_reg','ml_lstm_reg','ml_gru_reg','ml_tf_reg']},
  {label:'🌌 Kronos Foundation', desc:'K-line foundation model · zero-shot · HF 다운로드 필요',
    ids:['kronos_mini','kronos_small','kronos_base']},
];

// ---------- 컴팩트 chip 업데이트 ----------
function renderStratCards(){
  const s = STRATEGIES.find(x => x.id === CURRENT_STRAT);
  if(!s) return;
  $('#strat-current-name').textContent = s.label || CURRENT_STRAT;
  $('#strat-current-desc').textContent = '· ' + (s.desc || '');
  // 추천 표시
  const rec = _regimeRecommended.has(CURRENT_STRAT);
  const chip = $('#strat-current-chip');
  chip.style.borderColor = rec ? 'var(--amber)' : 'var(--cyan)';
  chip.style.color = rec ? 'var(--amber)' : 'var(--cyan)';
}

// ---------- 팝업 열기/닫기/렌더 ----------
function openStratPicker(){
  $('#strat-picker-mask').style.display = 'flex';
  $('#strat-picker-search').value = '';
  renderStratPicker('');
  setTimeout(() => $('#strat-picker-search').focus(), 60);
}
function closeStratPicker(){
  $('#strat-picker-mask').style.display = 'none';
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#strat-picker-mask').style.display === 'flex'){
    closeStratPicker();
  }
});

function renderStratPicker(query){
  query = (query || '').trim().toLowerCase();
  const body = $('#strat-picker-body');
  if(!body) return;
  const cards = (s) => {
    const on = s.id === CURRENT_STRAT;
    const dim = s._placeholder ? 'opacity:.45;' : '';
    const rec = _regimeRecommended.has(s.id);
    const recBadge = rec ?
      '<span style="background:var(--amber);color:#231400;padding:1px 5px;'+
      'border-radius:8px;font-size:9px;margin-left:6px">추천</span>' : '';
    return `<div onclick="selectStrategyFromPicker('${s.id}')"
      style="${dim}padding:9px 12px;background:${on?'rgba(61,240,255,.12)':'var(--panel2)'};
      border:1px solid ${on?'var(--cyan)':'var(--line)'};cursor:pointer;
      border-radius:3px;transition:all .12s ease"
      onmouseover="this.style.background='rgba(61,240,255,.08)'"
      onmouseout="this.style.background='${on?'rgba(61,240,255,.12)':'var(--panel2)'}'">
      <div style="font-family:var(--mono);font-size:12px;color:var(--cyan);
        font-weight:700">${s.label||s.id}${recBadge}</div>
      <div style="font-size:10.5px;color:var(--txt-dim);margin-top:3px;
        line-height:1.4">${s.desc||'—'}</div>
      <div style="font-size:9.5px;color:var(--txt-mute);margin-top:3px;
        font-family:var(--mono)">id: ${s.id}</div>
    </div>`;
  };
  // 카테고리별 섹션
  const sections = STRAT_CATEGORIES.map(cat => {
    const catStrats = cat.ids.map(id => STRATEGIES.find(s => s.id === id)).filter(Boolean);
    // 검색 필터
    const filtered = query ?
      catStrats.filter(s =>
        (s.id||'').toLowerCase().includes(query) ||
        (s.label||'').toLowerCase().includes(query) ||
        (s.desc||'').toLowerCase().includes(query)
      ) : catStrats;
    if(!filtered.length) return '';
    return `<div style="margin-bottom:18px">
      <div style="font-family:var(--mono);color:var(--amber);
        font-size:11px;letter-spacing:1px;margin-bottom:6px;
        border-bottom:1px solid var(--line);padding-bottom:4px">
        ${cat.label} <span style="color:var(--txt-mute);font-weight:400">
          · ${cat.desc} (${filtered.length})</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,
        minmax(220px,1fr));gap:8px">${filtered.map(cards).join('')}</div>
    </div>`;
  }).join('');

  // 미분류 (카테고리에 없는 전략들)
  const allCatIds = new Set(STRAT_CATEGORIES.flatMap(c => c.ids));
  const uncat = STRATEGIES.filter(s => !allCatIds.has(s.id));
  const uncatFiltered = query ?
    uncat.filter(s =>
      (s.id||'').toLowerCase().includes(query) ||
      (s.label||'').toLowerCase().includes(query)
    ) : uncat;
  const uncatSection = uncatFiltered.length ?
    `<div style="margin-bottom:18px">
      <div style="font-family:var(--mono);color:var(--txt-dim);
        font-size:11px;letter-spacing:1px;margin-bottom:6px;
        border-bottom:1px solid var(--line);padding-bottom:4px">
        🧪 기타 (${uncatFiltered.length})</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,
        minmax(220px,1fr));gap:8px">${uncatFiltered.map(cards).join('')}</div>
    </div>` : '';

  body.innerHTML = (sections + uncatSection) ||
    '<div style="padding:30px;text-align:center;color:var(--txt-mute)">검색 결과 없음</div>';
}

function setMode(m){

function renderParams(){
  const s = STRATEGIES.find(x => x.id === CURRENT_STRAT);
  if(!s){ $('#adv-params').style.display = 'none'; return; }
  if(MODE === 'simple'){
    $('#adv-params').style.display = 'none';
    return;
  }
  $('#adv-params').style.display = '';
  $('#param-rows').innerHTML = s.params.map(p => {
    const cur = _paramValue(p.name, p.def);
    const fmt = (v) => p.isFloat ?
      (+v).toFixed(p.step < 0.1 ? 2 : (p.step < 1 ? 2 : 1)) : (+v);
    // range slider + 직접 입력 가능한 number input 동시 노출
    return `<div class="param-row">
      <label title="${p.name} (기본 ${p.def} · ${p.min}~${p.max} · step ${p.step})">${p.label}</label>
      <input type="range" id="p-${p.name}" min="${p.min}" max="${p.max}"
        step="${p.step}" value="${cur}"
        oninput="document.getElementById('pn-${p.name}').value=this.value;
                 $('#pv-${p.name}').textContent=this.value">
      <input type="number" id="pn-${p.name}" value="${cur}"
        min="${p.min}" max="${p.max}" step="${p.step}"
        oninput="document.getElementById('p-${p.name}').value=this.value;
                 $('#pv-${p.name}').textContent=this.value"
        style="width:70px;background:var(--panel2);border:1px solid var(--line);
        color:var(--cyan);padding:3px 5px;font-family:var(--mono);font-size:11px;
        margin-left:6px">
      <span class="v" id="pv-${p.name}" style="margin-left:6px;color:var(--txt-mute);font-size:10.5px">${fmt(cur)}</span>
    </div>`;
  }).join('');
}

const _paramStore = {};   // {strategy: {paramName: value}}
function _paramValue(name, def){
  return (_paramStore[CURRENT_STRAT] && _paramStore[CURRENT_STRAT][name])
    || def;
}
function _gatherParams(){
  const s = STRATEGIES.find(x => x.id === CURRENT_STRAT);
  if(!s) return {};
  const out = {};
  for(const p of s.params){
    const el = $('#p-' + p.name);
    if(!el){ out[p.name] = p.def; continue; }
    // float vs int 자동 처리
    out[p.name] = p.isFloat ? parseFloat(el.value) : parseInt(el.value, 10);
  }
  _paramStore[CURRENT_STRAT] = out;
  return out;
}

// ---------- 백테스트 실행 ----------
async function runBacktest(){
  const tk = $('#ticker').value.trim().toUpperCase();
  if(!tk){ alert('티커 입력'); return; }
  const period = parseInt($('#period').value, 10);
  const params = MODE === 'advanced' ? _gatherParams() :
    Object.fromEntries(STRATEGIES.find(x => x.id === CURRENT_STRAT)
      .params.map(p => [p.name, p.def]));

  $('#run-btn').disabled = true;
  $('#run-btn').textContent = '⌛ 실행 중…';
  $('#status').textContent = `${tk} ${CURRENT_STRAT} 백테스트 중…`;
  $('#result-body').innerHTML =
    '<div style="color:var(--cyan);font-family:var(--mono);font-size:11px;'+
    'padding:14px 0;text-align:center">⌛ 처리 중…</div>';

  try{
    // 1) OHLCV 차트용 데이터 (선택 timeframe)
    const tf = $('#timeframe').value || '1d';
    const tfRange = tf === '1d' ? 'full' : tf;
    const chartResp = await fetch(
      `/api/chart?ticker=${encodeURIComponent(tk)}&range=${tfRange}`
    ).then(r => r.json());
    const allCandles = chartResp.candles || [];
    // 일봉은 period_days 만큼만, 분봉은 그대로 (이미 제한됨)
    const candles = tf === '1d' ? allCandles.slice(-period) : allCandles;
    if(candles.length < 20){
      throw new Error('데이터 부족');
    }
    candleSeries.setData(candles.map(c =>
      ({time:c.t, open:c.o, high:c.h, low:c.l, close:c.c})));
    chart.timeScale().fitContent();
    $('#data-info').textContent = `${candles.length} bars · 마지막: ${candles[candles.length-1].t}`;

    // 2) 백테스트 호출 (C10: interval 전달 + P5: 포지션 옵션)
    const _v = id => { const el=document.getElementById(id);
      if(!el) return null; const v=el.value.trim();
      return (v===''||isNaN(+v)) ? null : +v; };
    const btResp = await fetch('/api/strategy/backtest', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        ticker:tk, strategy:CURRENT_STRAT, params,
        period_days:period,
        interval: tf,
        // P5: 포지션 사이징 / 레버리지 / 손익절
        size:       _v('bt-size'),
        size_type:  (document.getElementById('bt-size-type')||{}).value || 'amount',
        leverage:   _v('bt-leverage') || 1.0,
        slippage:   _v('bt-slip') ?? 0.0001,
        sl_stop:    _v('bt-sl'),
        tp_stop:    _v('bt-tp'),
        trail_stop: _v('bt-trail'),
        // Tier1 #2: 자동 Almgren-Chriss 슬리피지
        auto_slippage: (document.getElementById('bt-auto-slip')||{}).checked || false,
      }),
    }).then(r => r.json());

    if(!btResp.ok){
      throw new Error(btResp.error || '백테스트 실패');
    }
    lastResult = btResp;
    renderResult(btResp);
    // 3) 매수/매도 마커 (서버가 entry_signals 제공 시)
    if(btResp.entry_signals && btResp.exit_signals){
      drawMarkers(btResp.entry_signals, btResp.exit_signals);
    }
    $('#status').innerHTML = '<span class="ok">✓ 완료</span> · ' +
      `${btResp.elapsed_sec}초`;
  }catch(e){
    $('#status').innerHTML = '<span class="err">✗ ' + e.message + '</span>';
    $('#result-body').innerHTML =
      `<div style="color:var(--down);font-size:11px;padding:14px 0">
        ${e.message}</div>`;
  }finally{
    $('#run-btn').disabled = false;
    $('#run-btn').textContent = '▶ 실행';
  }
}

function drawMarkers(entries, exits){
  const markers = [];
  for(const t of entries){
    markers.push({time:t, position:'belowBar', color:'#ff5a52',
      shape:'arrowUp', text:'BUY'});
  }
  for(const t of exits){
    markers.push({time:t, position:'aboveBar', color:'#4d9cff',
      shape:'arrowDown', text:'SELL'});
  }
  // 시간순 정렬
  markers.sort((a,b) => (a.time < b.time ? -1 : 1));
  candleSeries.setMarkers(markers);
}

// ⭐ 컬렉션 저장
async function saveToCollection(){
  if(!window.lastResult){ alert('백테스트 결과 없음'); return; }
  const r = window.lastResult;
  const m = r.metrics || {};
  const def_name = `${r.ticker} ${r.strategy} (Sharpe ${m.sharpe})`;
  const name = prompt('컬렉션 이름:', def_name);
  if(!name) return;
  const notes = prompt('메모 (선택):', '') || '';
  try{
    const resp = await(await fetch('/api/strategy/collection', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: name,
        strategy: r.strategy,
        params: r.params || {},
        ticker: r.ticker,
        notes: notes,
        source: 'STRATEGY_BACKTEST',
        metrics: {
          sharpe: m.sharpe,
          total_return: m.total_return,
          max_drawdown: m.max_drawdown,
          win_rate: m.win_rate,
          n_trades: m.n_trades,
          psr: m.psr,
        },
      }),
    })).json();
    if(resp.ok){
      alert('✓ 컬렉션 저장됨 (id=' + resp.id + ')\n\n🎯 HUB → ⭐ 컬렉션에서 확인');
    } else { alert('실패: ' + (resp.error||'')); }
  }catch(e){ alert(e.message); }
}

// Tier2 #10: Tear Sheet PDF 다운로드
async function downloadStrategyTearsheet(){
  if(!window.lastResult){ alert('백테스트 결과 없음'); return; }
  try{
    const r = await fetch('/api/tearsheet/strategy', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({result: window.lastResult}),
    });
    if(!r.ok){ alert('PDF 생성 실패'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const tk = window.lastResult.ticker || 'STRATEGY';
    const strat = window.lastResult.strategy || '';
    a.href = url; a.download = `${tk}_${strat}_tearsheet.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){ alert(e.message); }
}

// P3: pf.stats() 30+ 지표를 그룹별로
function renderStatsFull(r){
  const sf = r.stats_full;
  if(!sf || !sf.groups || !sf.groups.length) return '';
  const fmtVal = v => {
    if(v === null || v === undefined) return '—';
    if(typeof v === 'number'){
      const abs = Math.abs(v);
      if(abs >= 1000) return v.toFixed(0);
      if(abs >= 1)    return v.toFixed(3);
      return v.toFixed(4);
    }
    return String(v);
  };
  const groups = sf.groups.map(g => {
    const rows = g.items.map(it =>
      `<tr><td style="padding:3px 8px;color:var(--txt-dim);font-size:10.5px">${it.ko}</td>
       <td style="padding:3px 8px;text-align:right;font-family:var(--mono);
         font-size:10.5px;color:var(--txt)">${fmtVal(it.value)}</td></tr>`).join('');
    return `<div style="margin-top:8px">
      <div style="font-family:var(--mono);font-size:9.5px;
        color:var(--cyan-dim);letter-spacing:1.5px;margin-bottom:3px">
        ▸ ${g.label}</div>
      <table style="width:100%;border-collapse:collapse">${rows}</table>
    </div>`;
  }).join('');
  return `<details style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px">
    <summary style="cursor:pointer;font-family:var(--mono);font-size:11px;
      color:var(--cyan);letter-spacing:1px">▸ 풍부 지표 (${
        sf.groups.reduce((a,g) => a + g.items.length, 0)}개)</summary>
    ${groups}
  </details>`;
}

function renderQsExtra(r){
  const q = r.qs_extra;
  if(!q || Object.keys(q).length === 0) return '';
  const labels = {
    skew:"왜도", kurtosis:"첨도",
    var_95:"VaR 95%", cvar_95:"CVaR 95%",
    tail_ratio:"Tail Ratio",
    common_sense_ratio:"Common Sense",
    cpc_index:"CPC Index",
    outlier_win_ratio:"Outlier Win",
    outlier_loss_ratio:"Outlier Loss",
    ulcer_index:"Ulcer Index",
    kelly_criterion:"Kelly",
  };
  const src = q._source || '';
  const items = Object.entries(q).filter(([k]) => !k.startsWith('_'))
    .map(([k,v]) =>
      `<div style="display:flex;justify-content:space-between;
        padding:3px 8px;border-bottom:1px dashed var(--line)">
        <span style="color:var(--txt-dim);font-size:10.5px">${labels[k]||k}</span>
        <span style="font-family:var(--mono);font-size:10.5px;color:var(--txt)">${
          (v===null||v===undefined)?'—':(typeof v==='number'?v.toFixed(4):v)
        }</span>
      </div>`).join('');
  return `<details style="margin-top:8px">
    <summary style="cursor:pointer;font-family:var(--mono);font-size:11px;
      color:var(--cyan);letter-spacing:1px">▸ 통계 추가 지표 (${src})</summary>
    <div style="margin-top:4px">${items}</div>
  </details>`;
}

// ---------- Grid Search ----------
async function runGrid(){
  const tk = $('#ticker').value.trim().toUpperCase();
  if(!tk){ alert('티커 입력'); return; }
  const s = STRATEGIES.find(x => x.id === CURRENT_STRAT);
  if(!s){ return; }
  const period = parseInt($('#period').value, 10);
  // 각 int 파라미터에 5개 균등값
  const grid = {};
  for(const p of s.params){
    const vals = [];
    for(let i = 0; i < 5; i++){
      const v = Math.round(p.min + (p.max - p.min) * i / 4);
      if(!vals.includes(v)) vals.push(v);
    }
    grid[p.name] = vals;
  }

  $('#grid-btn').disabled = true;
  $('#grid-btn').textContent = '⌛ Grid…';
  $('#status').textContent = `${tk} grid search…`;

  try{
    const r = await fetch('/api/strategy/grid', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        ticker:tk, strategy:CURRENT_STRAT, grid,
        period_days:period, top_n:10,
      }),
    }).then(r => r.json());
    if(!r.ok){
      throw new Error(r.error || '실패');
    }
    renderGridResult(r);
    $('#status').innerHTML = '<span class="ok">✓ Grid 완료</span> · ' +
      `${r.n_tested}조합 · ${r.elapsed_sec}초`;
  }catch(e){
    $('#status').innerHTML = '<span class="err">✗ ' + e.message + '</span>';
  }finally{
    $('#grid-btn').disabled = false;
    $('#grid-btn').textContent = '⚙ Grid';
  }
}

function renderGridResult(r){
  // 한글 라벨 매핑 (서버 응답)
  const labels = r.param_labels || {};
  const rows = r.results.map((x, i) => {
    const col = x.sharpe >= 1 ? 'var(--up)' :
                x.sharpe >= 0 ? 'var(--amber)' : 'var(--down)';
    const pStr = Object.entries(x.params).map(([k,v]) =>
      `${labels[k]||k}=${v}`).join(' · ');
    return `<tr style="border-bottom:1px solid var(--line)">
      <td style="padding:4px 5px;color:var(--txt-mute);font-size:10px">
        ${i+1}</td>
      <td style="padding:4px 5px;font-family:var(--mono);
        font-size:10px">${pStr}</td>
      <td style="padding:4px 5px;text-align:right;font-family:var(--mono);
        font-size:11px;color:${col};font-weight:700">
        ${x.sharpe.toFixed(2)}</td>
      <td style="padding:4px 5px;text-align:right;font-family:var(--mono);
        font-size:11px">${(x.total_return*100).toFixed(1)}%</td>
      <td style="padding:4px 5px;text-align:right;font-family:var(--mono);
        font-size:10px;color:var(--down)">
        ${(x.max_drawdown*100).toFixed(1)}%</td>
    </tr>`;
  }).join('');
  $('#result-body').innerHTML = `
    <div style="font-family:var(--mono);font-size:10px;
      color:var(--cyan-dim);letter-spacing:1.5px;margin-bottom:6px">
      GRID RESULTS · ${r.n_tested}조합 · Sharpe 정렬</div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="color:var(--cyan-dim);font-family:var(--mono);
        font-size:9px;border-bottom:1px solid var(--cyan-dim)">
        <th style="padding:4px;text-align:left">#</th>
        <th style="padding:4px;text-align:left">파라미터</th>
        <th style="padding:4px;text-align:right">Sharpe</th>
        <th style="padding:4px;text-align:right">수익</th>
        <th style="padding:4px;text-align:right">MDD</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:10px;font-size:11px;color:var(--txt-mute)">
      최상위 행 클릭 시 해당 파라미터로 차트 시각화 (TODO)
    </div>
  `;
}

// ---------- 부팅 ----------
let _regimeRecommended = new Set();

async function loadRegime(){
  const tk = $('#ticker').value.trim().toUpperCase();
  if(!tk){ return; }
  $('#regime-bar').style.display = '';
  $('#regime-text').textContent = `⌛ ${tk} regime 감지 중…`;
  try{
    const r = await fetch(`/api/strategy/regime?ticker=${encodeURIComponent(tk)}`)
      .then(x => x.json());
    if(!r.ok){
      $('#regime-text').innerHTML =
        `<span style="color:var(--down)">✗ ${r.error||'감지 실패'}</span>`;
      return;
    }
    const conf = Math.round((r.confidence||0)*100);
    const regCol = r.regime.startsWith('trending_up') ? 'var(--up)' :
                   r.regime.startsWith('trending_down') ? 'var(--down)' :
                   r.regime === 'high_vol' ? 'var(--amber)' :
                   'var(--cyan)';
    $('#regime-text').innerHTML =
      `<b style="color:${regCol}">${r.regime_kr}</b> · 신뢰 ${conf}% · `+
      `<span style="color:var(--txt-mute)">${r.rationale_kr}</span> · `+
      `<span style="color:var(--cyan)">추천: ${
        r.recommended_strategies.map(s => s.label).slice(0,3).join(', ')}</span>`;
    // 추천 전략 highlight
    _regimeRecommended = new Set(r.recommended_strategies.map(s => s.id));
    renderStratCards();
  }catch(e){
    $('#regime-text').innerHTML =
      `<span style="color:var(--down)">✗ 네트워크 오류</span>`;
  }
}

function onTimeframeChange(){
  // 차트만 즉시 새로고침 (백테스트는 사용자가 ▶ 실행 누를 때)
  const tk = $('#ticker').value.trim().toUpperCase();
  if(!tk) return;
  const tf = $('#timeframe').value || '1d';
  const tfRange = tf === '1d' ? 'full' : tf;
  fetch(`/api/chart?ticker=${encodeURIComponent(tk)}&range=${tfRange}`)
    .then(r => r.json()).then(d => {
      const cs = d.candles || [];
      if(cs.length){
        candleSeries.setData(cs.map(c =>
          ({time:c.t, open:c.o, high:c.h, low:c.l, close:c.c})));
        chart.timeScale().fitContent();
        $('#data-info').textContent = `${cs.length} bars · ${tf}`;
      }
    });
}

async function loadStrategies(){
  try{
    const r = await fetch('/api/strategy/meta').then(x => x.json());
    if(r && r.strategies){
      STRATEGIES = Object.entries(r.strategies).map(([id, s]) => ({
        id,
        label: s.label,
        desc: s.desc,
        params: (s.params || []).map(p => {
          // 타입별 step 자동 결정
          // type=float이거나 default가 정수 아니면 소수점 step
          const isFloat = (p.type === 'float') ||
            (typeof p.default === 'number' && !Number.isInteger(p.default));
          // 범위 폭에 비례한 step (예: 0~1 → 0.01, 0~10 → 0.1)
          const range = Math.abs((p.max||1) - (p.min||0));
          const autoStep = isFloat ?
            (range <= 1 ? 0.01 : range <= 10 ? 0.05 : 0.1) : 1;
          return {
            name: p.name,
            label: p.label || p.name,
            def: p.default,
            min: p.min,
            max: p.max,
            step: autoStep,
            isFloat,
          };
        }),
      }));
      if(STRATEGIES.length && !STRATEGIES.find(s => s.id === CURRENT_STRAT)){
        CURRENT_STRAT = STRATEGIES[0].id;
      }
    }
  }catch(e){
    console.warn('전략 메타 로드 실패', e);
  }
  renderStratCards();
  renderParams();
}

async function applyStrategy(item){
  const tk = $('#ticker').value.trim().toUpperCase();
  if(!confirm(`${tk}에 ${item.strategy}(${JSON.stringify(item.params)}) 전략 적용?\n` +
              '계정에 저장되어 메인 차트에 자동 표시됩니다.')) return;
  try{
    const r = await fetch('/api/strategy/active', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        ticker: tk,
        strategy: item.strategy,
        params: item.params,
      }),
    }).then(x => x.json());
    if(r.ok){
      alert('✓ 적용 완료. 메인 차트에서 자동으로 마커가 그려집니다.');
    }else{
      alert('적용 실패: ' + (r.error || ''));
    }
  }catch(e){
    alert('네트워크 오류: ' + e);
  }
}

window.addEventListener('DOMContentLoaded', async () => {

});
